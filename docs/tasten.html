<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tastentest</title>
<style>
  body { font: 20px/1.4 system-ui, sans-serif; margin: 16px; background: #0f1115; color: #eee; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  #last { font-size: 28px; padding: 12px; background: #1d4ed8; border-radius: 8px; margin: 12px 0; min-height: 2.4em; }
  table { border-collapse: collapse; width: 100%; }
  td, th { border-bottom: 1px solid #333; padding: 4px 8px; text-align: left; }
  .ms { color: #ffb300; }
</style>
</head>
<body>
<h1>Tastentest</h1>
<p>Drücke Tasten der Fernbedienung oder der Tastatur. Unten steht, was der Browser meldet (neueste oben). Bitte schick mir die Liste (Screenshot) – besonders für Play/Pause, Skip, Vor/Zurück, P+/P−, Stop, Farbtasten.</p>
<div id="last">Noch keine Taste …</div>
<table><thead><tr><th>Ereignis</th><th>key</th><th>code</th><th>keyCode</th></tr></thead><tbody id="log"></tbody></table>
<script>
"use strict";
const last = document.getElementById("last");
const log = document.getElementById("log");
function add(type, key, code, kc, cls) {
  last.textContent = `${type}: ${key}${code ? " · " + code : ""}${kc ? " · " + kc : ""}`;
  const tr = document.createElement("tr");
  if (cls) tr.className = cls;
  for (const t of [type, key, code, kc]) { const td = document.createElement("td"); td.textContent = t == null ? "" : t; tr.append(td); }
  log.prepend(tr);
  while (log.children.length > 40) log.lastChild.remove();
}
for (const type of ["keydown", "keyup"]) {
  document.addEventListener(type, (e) => { e.preventDefault(); add(type, JSON.stringify(e.key), e.code, e.keyCode); }, true);
}
const ms = navigator.mediaSession;
if (ms && ms.setActionHandler) {
  for (const a of ["play", "pause", "previoustrack", "nexttrack", "seekbackward", "seekforward", "stop"]) {
    try { ms.setActionHandler(a, () => add("Media Session", a, "", "", "ms")); } catch (err) { /* nicht unterstuetzt */ }
  }
  // Medien-Tasten kommen oft nur an, wenn die Seite "Medien abspielt": stiller Ton
  document.addEventListener("keydown", function once() {
    document.removeEventListener("keydown", once, true);
    try {
      const a = new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=");
      a.loop = true; a.play().catch(() => {});
    } catch (err) { /* egal */ }
  }, true);
}
</script>
</body>
</html>
