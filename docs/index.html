<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="app-version" content="0.6.25">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <title>Fotoschatz</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-180.png">
  <link rel="stylesheet" href="styles.css?v=0.6.25">
  <script src="orte.js?v=0.6.25" defer></script>
  <script src="app.js?v=0.6.25" defer></script>
</head>
<body>
  <header id="top">
    <button id="back" class="icon-btn" type="button" aria-label="Zurück" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 4.5 8 12l7.5 7.5"/></svg>
    </button>
    <div class="titles">
      <h1 id="title">Fotoschatz</h1>
      <div id="subtitle"></div>
    </div>
  </header>

  <main id="main"><p class="center muted">Lade …</p></main>

  <nav id="nav" hidden>
    <button type="button" data-view="folders">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5a1.5 1.5 0 0 1 1.5-1.5h4.4l2 2h8.6A1.5 1.5 0 0 1 21 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>
      <span>Ordner</span>
    </button>
    <button type="button" data-view="all">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>
      <span>Alle Bilder</span>
    </button>
    <button type="button" data-view="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></svg>
      <span>Suche</span>
    </button>
  </nav>

  <div id="viewer" hidden>
    <div class="v-stage"><img class="v-photo" alt=""></div>
    <div class="v-top">
      <button type="button" class="icon-btn v-close" aria-label="Schließen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div class="v-actions">
        <span class="v-counter"></span>
        <button type="button" class="icon-btn v-info-btn" aria-label="Infos ein/aus">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>
        </button>
        <button type="button" class="icon-btn v-fs-btn" aria-label="Vollbild ein/aus">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
      </div>
    </div>
    <button type="button" class="v-nav v-prev" aria-label="Vorheriges Bild">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 4.5 8 12l7.5 7.5"/></svg>
    </button>
    <button type="button" class="v-nav v-next" aria-label="Nächstes Bild">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 4.5 16 12l-7.5 7.5"/></svg>
    </button>
    <div class="v-info"></div>
  </div>

  <noscript><p class="center">Fotoschatz braucht JavaScript.</p></noscript>
</body>
</html>
