<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="app-version" content="0.1.3">
  <title>Fotoschatz</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111418;
      color: #e8eaed;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    main { padding: 2rem; }
    h1 { margin: 0 0 .5rem; font-size: 1.75rem; letter-spacing: .02em; }
    p.sub { margin: 0 0 2rem; color: #9aa0a6; }
    .version {
      display: inline-block;
      padding: .5rem 1rem;
      border: 1px solid #2c3136;
      border-radius: 999px;
      background: #191d22;
      font-variant-numeric: tabular-nums;
      font-size: 1.25rem;
    }
    .version span { color: #8ab4f8; font-weight: 600; }
    footer { margin-top: 2rem; font-size: .8rem; color: #6b7076; }
  </style>
</head>
<body>
  <main>
    <h1>Fotoschatz</h1>
    <p class="sub">Deploy-Test – die Seite ist live.</p>
    <p class="version">Version <span id="version">0.1.3</span></p>
    <footer>Private Fotogalerie · GitHub Pages</footer>
  </main>
</body>
</html>
