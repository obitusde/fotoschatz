name: release

# Bei Push auf einen Claude-Arbeits-Branch: automatisch nach main uebernehmen
# und danach den Deploy anstossen.
#
# Warum workflow_dispatch: Ein Push mit GITHUB_TOKEN startet keine weiteren
# Workflows, und die Pages-Umgebung "github-pages" laesst nur Deployments von
# main zu. Der Deploy wird deshalb ausdruecklich auf dem Ref main angestossen
# und hier bis zum Ergebnis beobachtet.
on:
  push:
    branches:
      - 'claude/**'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  release:
    name: Nach main uebernehmen und deployen
    runs-on: ubuntu-latest
    steps:
      - name: Repo holen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git-Identitaet setzen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Uebernehmen (fast-forward, sonst Merge-Commit)
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          BRANCH="${{ github.ref_name }}"
          git fetch origin main
          git checkout -B main origin/main
          if git merge --ff-only "$SHA"; then
            echo "Fast-forward von $BRANCH nach main."
          else
            echo "Kein Fast-forward moeglich -> Merge-Commit."
            if ! git merge --no-ff --no-edit -m "Merge $BRANCH nach main" "$SHA"; then
              echo "::error::Merge-Konflikt zwischen $BRANCH und main. Abbruch - bitte manuell aufloesen."
              git merge --abort || true
              exit 1
            fi
          fi
          git push origin main

      - name: Deploy anstossen und beobachten
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VORHER="$(gh run list --workflow deploy.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run deploy.yml --ref main
          RUN_ID=""
          for _ in $(seq 1 30); do
            sleep 5
            KANDIDAT="$(gh run list --workflow deploy.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ "$KANDIDAT" != "$VORHER" ] && [ "$KANDIDAT" != "0" ]; then
              RUN_ID="$KANDIDAT"
              break
            fi
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::Der Deploy-Lauf ist nicht gestartet."
            exit 1
          fi
          echo "Deploy-Lauf: https://github.com/${{ github.repository }}/actions/runs/$RUN_ID"
          gh run watch "$RUN_ID" --exit-status --interval 10
